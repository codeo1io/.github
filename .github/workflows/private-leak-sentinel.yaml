# Private-leak sentinel — reusable gitleaks scan for codeo1io repos.
# Call from a repo's own workflow:
#
#   jobs:
#     private-leak:
#       uses: codeo1io/.github/.github/workflows/private-leak-sentinel.yaml@main
#
# No secrets required beyond the implicit GITHUB_TOKEN. Fails the job on any
# finding; uploads the SARIF report as an artifact on failure.
#
# Supply chain (cycle-4 rm-036 / batch D2 + review fixes): every action ref is
# SHA-pinned, and the gitleaks binary version is pinned via GITLEAKS_VERSION in
# the step env — gitleaks-action's installer (src/gitleaks.js) fetches
# releases/latest UNCHECKED when that env is unset, so this pin is what
# actually closes the unpinned-latest install hole (review P2). The fleet
# config is checked out from this repository at an explicit SHA (input default
# below) instead of a mutable raw.githubusercontent @main fetch with a
# cache-bust query. Bump all three pins deliberately (rm-039 Dependabot would
# automate the refresh).
#
# Scan semantics (gitleaks-action v3): push/pull_request runs scan only the
# NEW commits in the event (push payloads cap at 20); schedule/workflow_dispatch
# runs scan full history. Legacy-leak coverage rides on the weekly schedule.
#
# PROMOTE RIDER (execute at the commit gate): bump the config-ref default
# below from the pre-cycle-4 main tip to this batch's commit SHA so callers
# pick up the hardened gitleaks.toml.
name: private-leak-sentinel

on:
  workflow_call:
    inputs:
      config-ref:
        description: >-
          codeo1io/.github git ref holding the fleet gitleaks.toml. Default is
          the last pre-cycle-4 main tip; the .github self-scan caller
          (leak-sentinel-self.yaml) passes github.sha so every push is scanned
          with exactly the config it ships.
        type: string
        default: "7d47ab484a937c5742ddcb3b69399495e8342beb"  # pre-cycle-4 main tip; bump at promote

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # schedule/dispatch scans need full history; push/PR events scan the incremental range

      - name: Check out fleet gitleaks config (pinned ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codeo1io/.github
          ref: ${{ inputs.config-ref }}
          path: sentinel-config
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: sentinel-config/gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"  # action default is unchecked releases/latest
