# gitleaks configuration — codeo1io fleet private-leak sentinel
# Full option list: https://github.com/gitleaks/gitleaks
title = "codeo1io fleet private-leak sentinel"

[extend]
# Extends the default ruleset (API keys, tokens, AWS, etc.) — we add fleet-specific
# rules on top rather than replacing it.
useDefault = true

[[rules]]
id = "hermes-hass-token"
description = "Home Assistant long-lived access token"
regex = '''\b(hass_token|HASS_TOKEN)\s*[:=]\s*["']?[A-Za-z0-9._\-]{20,}'''
tags = ["homeassistant", "hermes"]
keywords = ["hass_token", "HASS_TOKEN"]

[[rules]]
id = "wyoming-groq-key"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{20,}'''
tags = ["groq"]

[[rules]]
id = "hermes-env-file-inline"
description = "Inline .env secret assignment (non-example)"
regex = '''^\s*[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|API_KEY|PRIVATE_KEY)\s*=\s*["']?[A-Za-z0-9+/=_\-]{16,}["']?\s*$'''
path = '''(?i)\.env$|env\.local|\.secrets'''
tags = ["env"]

[[rules]]
id = "github-app-private-key"
description = "GitHub App private key (PEM body)"
regex = '''-----BEGIN RSA PRIVATE KEY-----'''
tags = ["github-app", "pem"]

# Override of the stock 'generic-api-key' rule. The stock regex fires on
# comments, import lists, and docstrings — 363 of 419 findings on hermes-agent,
# zero real secrets (triaged 2026-09-21). Narrowed to assignment-shaped matches
# with an entropy floor; every other default rule runs unchanged.
[[rules]]
id = "generic-api-key"
description = "Generic API Key (fleet-narrowed)"
regex = '''(?i)(?:api[_-]?key|token|secret|password|passwd|credential)[a-z0-9_]*\s*[:=]\s*["'][A-Za-z0-9+/=_.\-]{16,}["']'''
entropy = 3.5
keywords = ["key", "token", "secret", "password", "passwd", "credential"]
tags = ["key", "generic"]

[allowlist]
description = "Known-safe paths and test fixtures"
paths = [
  '''(?i)\.(lock|md|snap|png|jpg|jpeg|gif|webp)$''',
  '''gitleaks\.toml''',
  '''(?i)test/fixtures/''',
  '''(?i)tests?/.*fixtures?''',
  '''(?i)(tests?|e2e|evals)/.*''',
  '''(?i)\.(test|spec)\.[a-z]+$''',
  '''(?i)conftest\.py$''',
  '''(?i)native/.*/vendor/''',
  '''node_modules/''',
  '''web/dist/''',
  '''dist/''',
  # agent/redact.py and its tests deliberately contain secret-shaped strings —
  # they are the redaction engine itself; the sentinel would otherwise flag
  # the exact code that protects the fleet.
  '''agent/redact\.py$''',
  # Vendored upstream history: an accidental session export (exprted.jsonl,
  # removed from HEAD in 9a19fe1f) trips discord-client-id rules; zero real
  # token shapes verified 2026-09-21. Allowlisting the path quiets history scans.
  '''exprted\.jsonl''',
]
commits = []
# Repo-env templates with placeholder values are fine
regexes = [
  '''xxx+''',
  '''CHANGE_ME''',
  '''<your[_-]?(token|key|secret)?>''',
  '''\$\{[A-Z_]+\}''',
  '''ghp_xxxxxxxxxxxxxxxxxxxx''',
  # OAuth client secrets of native/PKCE apps are public by design (Google
  # installed-app flow), as are env/header NAME constants and redacted
  # "ab12...yz" stubs. The last 7 findings on the 2026-09-21 hermes-agent
  # full-history scan were exactly these - triaged benign one by one.
  '''(?i)public[_-]?client[_-]?secret|SECRET_(?:HEADER|ENV|SUFFIX)\s*=''',
  '''(?i)PLACEHOLDER''',
  '''\.\.\.''',
  # Redacted stub literals verified across all history variants
  # (2026-09-21: every commit of both files carries only these).
  '''8fda2\.\.\.[0-9a-f]*7''',
  '''sk-_yo\.\.\._rpg''',
]

